<style>
  @font-face { font-family: "Shippori"; src: url("assets/fonts/shippori.woff2") format("woff2"); font-weight: 700; font-display: block; }
  @font-face { font-family: "ZenMaru"; src: url("assets/fonts/zenmaru.woff2") format("woff2"); font-weight: 500; font-display: block; }
  @font-face { font-family: "Cormorant"; src: url("assets/fonts/cormorant.woff2") format("woff2"); font-weight: 500; font-style: italic; font-display: block; }
  :root { --bg: #07060d; --fg: #fbeff3; --accent: #ff9fbf; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;

  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #film { width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; display: block; background: #000; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;

  #play:hover:not(:disabled) { background: rgba(255,159,191,.3); transform: translateY(-1px); }
  #play:disabled { opacity: .6; cursor: progress; }
  .loadbar { width: min(260px, 70vw); height: 2px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; }
  #load { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .hint { font-size: 12px !important; color: #8f8296 !important; }
  #progress { position: fixed; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.06); }
  #bar { height: 100%; background: linear-gradient(90deg, #ffb3c9, #ffd9a0); transform-origin: left; transform: scaleX(0); }
  #video { display: none; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: #000; }
  body.videomode #film { display: none; }
  body.videomode #video { display: block; }
  .links { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: 14px; }
  .links a { color: #ffc6d8; }
  body.render #overlay, body.render #progress { display: none; }
  body.render #stage { position: static; display: block; }
  body.render #film { width: 1920px; height: 1080px; }
